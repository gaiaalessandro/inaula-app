<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>InAula - Gestione e Calcolo Presenze Universitarie</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="bricolage-latin.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --txt: #f8fafc;
      --sub: #94a3b8;
      --acc: #38bdf8;
      --border: #334155;
      --danger: #ef4444;
      --success: #22c55e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--txt); min-height: 100vh; padding-bottom: 70px; }
    .hidden { display: none !important; }
    header { background: var(--card); padding: 16px; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 1.25rem; font-weight: 700; color: var(--acc); }
    main { padding: 16px; max-width: 600px; margin: 0 auto; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    .btn { background: var(--acc); color: #000; border: none; padding: 10px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; width: 100%; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-sec { background: transparent; color: var(--txt); border: 1px solid var(--border); }
    .btn-sm { padding: 6px 12px; font-size: 0.8rem; width: auto; }
    .input-group { margin-bottom: 12px; }
    .input-group label { display: block; font-size: 0.85rem; color: var(--sub); margin-bottom: 4px; }
    .input-group input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--txt); }
    #nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 8px 0; z-index: 100; }
    #nav button { background: none; border: none; color: var(--sub); font-size: 0.75rem; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; flex: 1; }
    #nav button.on { color: var(--acc); font-weight: 600; }
    #nav button svg { width: 20px; height: 20px; fill: currentColor; }
    .syn { font-size: 0.75rem; color: var(--sub); text-align: center; margin-top: 8px; }
    .course-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); }
    .course-item:last-child { border-bottom: none; }
    .archived { opacity: 0.55; }
  </style>
</head>
<body>

  <header>
    <h1>InAula</h1>
    <div id="authStatus" class="syn">Inizializzazione…</div>
  </header>

  <main>
    <!-- LOGIN E REGISTRAZIONE -->
    <div id="v-auth" class="card">
      <h2 id="authTitle" style="margin-bottom: 12px;">Accedi a InAula</h2>
      <form id="lf">
        <div class="input-group hidden" id="nameRow">
          <label>Nome Completo</label>
          <input type="text" id="nm" placeholder="es. Mario Rossi">
        </div>
        <div class="input-group">
          <label>Email</label>
          <input type="email" id="em" required placeholder="tua@email.com">
        </div>
        <div class="input-group">
          <label>Password</label>
          <input type="password" id="pw" required placeholder="••••••••">
        </div>
        <div class="input-group hidden" id="tosRow" style="display: flex; gap: 8px; align-items: center;">
          <input type="checkbox" id="rem" checked style="width: auto;">
          <label for="rem" style="margin:0;">Rimani collegato</label>
        </div>
        <button type="submit" class="btn" id="go">Accedi</button>
      </form>
      <div id="amsg" style="color: var(--danger); font-size: 0.85rem; margin-top: 8px;"></div>
      <div style="margin-top: 16px; text-align: center;">
        <button type="button" class="btn btn-sec" id="sw">Non hai un account? Registrati</button>
      </div>
    </div>

    <!-- SCHEDA OGGI -->
    <div id="v-home" class="hidden">
      <div class="card">
        <h2>Lezioni di Oggi</h2>
        <div id="today" style="margin-top: 8px;">Nessuna lezione in programma.</div>
      </div>
    </div>

    <!-- SCHEDA INSEGNAMENTI & MODULI ARCHIVIATI -->
    <div id="v-courses" class="hidden">
      <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
          <h2>Insegnamenti</h2>
          <button class="btn btn-sec btn-sm" id="btnToggleArchived">Mostra Archiviati</button>
        </div>
        <div id="coursesList">Caricamento corsi…</div>
      </div>
    </div>

    <!-- SCHEDA STATISTICHE -->
    <div id="v-stats" class="hidden">
      <div class="card">
        <h2>Statistiche Presenze</h2>
        <div id="statsContent" style="margin-top: 8px;">Calcolo presenze in corso…</div>
      </div>
    </div>

    <!-- SCHEDA MENU -->
    <div id="v-menu" class="hidden">
      <div class="card">
        <h2>Impostazioni Account</h2>
        <p class="syn" style="margin-bottom: 16px; text-align: left;">Gestisci il tuo profilo e l'app InAula.</p>
        <button class="btn btn-sec" id="btnTheme" data-act="theme">Cambia Tema</button>
        <button class="btn" style="background: var(--danger); color: #fff; margin-top: 12px;" id="btnLogout">Esci dall'Account</button>
      </div>
    </div>
  </main>

  <!-- NAVBAR BOTTOM -->
  <nav id="nav" class="hidden">
    <button data-act="tab" data-s="home" class="on">
      <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      Oggi
    </button>
    <button data-act="tab" data-s="courses">
      <svg viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H8V4h12v12z"/></svg>
      Insegnamenti
    </button>
    <button data-act="tab" data-s="stats">
      <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/></svg>
      Statistiche
    </button>
    <button data-act="tab" data-s="menu">
      <svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
      Menu
    </button>
  </nav>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, setPersistence, browserLocalPersistence, browserSessionPersistence } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDJxzbPH1Rxm4roFOZFm2FDnc-p0LrzXP0",
      authDomain: "inaula-app.firebaseapp.com",
      projectId: "inaula-app",
      storageBucket: "inaula-app.appspot.com",
      messagingSenderId: "101793812502257",
      appId: "1:101793812502257:web:8d8f8d2e8b1b2f8a"
    };

    const fbApp = initializeApp(firebaseConfig);
    const auth = getAuth(fbApp);
    const fs = initializeFirestore(fbApp, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });

    // VARIABILI GLOBALI E STATO
    let S = { thr: 66, courses: [] }, tab = 'home', showArchived = false, mode = 'in';
    window.S = S;

    const $ = id => document.getElementById(id);
    const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', '\x27': '&#39;' }[c]));

    // NORMALIZZAZIONE DEI NOMI DEI MODULI (Raggruppa diciture simili o identiche)
    function normalizeCourseName(name) {
      if (!name) return '';
      return name.toLowerCase()
        .normalize("NFD").replace(/[\u0300-\u036f]/g, "") // Rimuove accenti
        .replace(/[^a-z0-9]/g, '')                       // Rimuove spazi, punti e caratteri speciali
        .trim();
    }

    // UNIFICAZIONE MODULI SIMILI IN UN UNICO INSEGNAMENTO
    function getNormalizedCourses(courses) {
      if (!courses || !Array.isArray(courses)) return [];
      const map = new Map();

      courses.forEach(c => {
        const key = normalizeCourseName(c.name);
        if (!map.has(key)) {
          map.set(key, { ...c, key, attended: c.attended || 0, total: c.total || 0 });
        } else {
          const existing = map.get(key);
          existing.attended += (c.attended || 0);
          existing.total += (c.total || 0);
          if (c.archived && !existing.archived) existing.archived = true;
        }
      });

      return Array.from(map.values());
    }

    // CAMBIO SCHEDA
    window.showTab = function(t) {
      tab = t;
      ['home', 'courses', 'stats', 'menu'].forEach(k => {
        const el = $('v-' + k);
        if (el) el.classList.toggle('hidden', k !== t);
      });
      if (t === 'courses') renderCourses();
      if (t === 'stats') renderStats();
      document.querySelectorAll('#nav [data-act="tab"]').forEach(b => {
        b.classList.toggle('on', b.dataset.s === t);
      });
      window.scrollTo(0, 0);
    };

    // RENDERING CORSI
    function renderCourses() {
      const container = $('coursesList');
      if (!container) return;

      const unifiedCourses = getNormalizedCourses(S.courses);

      if (unifiedCourses.length === 0) {
        container.innerHTML = '<p class="syn">Nessun insegnamento presente.</p>';
        return;
      }

      const visibleCourses = unifiedCourses.filter(c => showArchived ? true : !c.archived);
      
      if (visibleCourses.length === 0) {
        container.innerHTML = '<p class="syn">Tutti gli insegnamenti sono archiviati.</p>';
        return;
      }

      container.innerHTML = visibleCourses.map(c => `
        <div class="course-item ${c.archived ? 'archived' : ''}">
          <div>
            <strong>${esc(c.name)}</strong>
            <div class="syn" style="text-align:left;">Presenze: ${c.attended} / ${c.total} ore ${c.archived ? ' • (Archiviato)' : ''}</div>
          </div>
          <button class="btn btn-sec btn-sm" data-act="toggle-archive" data-key="${esc(c.key)}">
            ${c.archived ? 'Ripristina' : 'Archivia'}
          </button>
        </div>
      `).join('');
    }

    // RENDERING STATISTICHE
    function renderStats() {
      const container = $('statsContent');
      if (!container) return;
      const unified = getNormalizedCourses(S.courses);
      const totalAttended = unified.reduce((acc, c) => acc + c.attended, 0);
      const totalHours = unified.reduce((acc, c) => acc + c.total, 0);
      const perc = totalHours > 0 ? Math.round((totalAttended / totalHours) * 100) : 0;
      
      container.innerHTML = `
        <div style="font-size: 1.5rem; font-weight: 700; color: var(--acc);">${perc}%</div>
        <p class="syn" style="text-align: left;">Presenze totali: ${totalAttended} ore su ${totalHours}. Soglia minima target: ${S.thr}%.</p>
      `;
    }

    // TOGGLE ARCHIVIATI
    $('btnToggleArchived').onclick = () => {
      showArchived = !showArchived;
      $('btnToggleArchived').textContent = showArchived ? 'Nascondi Archiviati' : 'Mostra Archiviati';
      renderCourses();
    };

    // AUTH MODE SWITCHING
    function authMode(m) {
      mode = m;
      $('nameRow').classList.toggle('hidden', m !== 'up');
      $('tosRow').classList.toggle('hidden', m !== 'up');
      $('go').textContent = m === 'up' ? 'Registrati' : 'Accedi';
      $('sw').textContent = m === 'up' ? 'Hai già un account? Accedi' : 'Non hai un account? Registrati';
      $('authTitle').textContent = m === 'up' ? 'Crea il tuo account' : 'Accedi a InAula';
      $('amsg').textContent = '';
    }

    $('sw').onclick = () => authMode(mode === 'up' ? 'in' : 'up');

    // FORM LOGIN / REGISTRAZIONE
    $('lf').onsubmit = async (e) => {
      e.preventDefault();
      const em = $('em').value.trim();
      const pw = $('pw').value;
      const msg = $('amsg');
      msg.textContent = '';

      if (!em || pw.length < 6) {
        msg.textContent = 'Inserisci un\'email valida e una password di almeno 6 caratteri.';
        return;
      }

      $('go').disabled = true;
      try {
        await setPersistence(auth, $('rem').checked ? browserLocalPersistence : browserSessionPersistence);
        if (mode === 'in') {
          await signInWithEmailAndPassword(auth, em, pw);
        } else {
          const nm = $('nm').value.trim().slice(0, 40);
          if (nm.length < 2) {
            msg.textContent = 'Inserisci il tuo nome.';
            $('go').disabled = false;
            return;
          }
          const cr = await createUserWithEmailAndPassword(auth, em, pw);
          await setDoc(doc(fs, 'users', cr.user.uid), { thr: 66, courses: [], name: nm });
        }
      } catch (err) {
        msg.textContent = 'Errore: ' + (err.message || 'Operazione fallita');
      } finally {
        $('go').disabled = false;
      }
    };

    // LOGOUT
    $('btnLogout').onclick = () => signOut(auth);

    // AUTH STATE OBSERVER
    onAuthStateChanged(auth, async user => {
      if (user) {
        $('v-auth').classList.add('hidden');
        $('nav').classList.remove('hidden');
        $('authStatus').textContent = esc(user.email);
        try {
          const snap = await getDoc(doc(fs, 'users', user.uid));
          if (snap.exists()) {
            S = snap.data();
            window.S = S;
          }
        } catch (_) {}
        showTab('home');
      } else {
        $('v-auth').classList.remove('hidden');
        $('nav').classList.add('hidden');
        ['home', 'courses', 'stats', 'menu'].forEach(k => $('v-' + k).classList.add('hidden'));
        $('authStatus').textContent = 'Non collegato';
      }
    });

    // LISTENER GLOBALE PER BOTTONI E ARCHIVIAZIONE
    document.addEventListener('click', (e) => {
      const b = e.target.closest('[data-act]');
      if (!b) return;
      const a = b.dataset.act;
      if (a === 'tab') {
        showTab(b.dataset.s);
      } else if (a === 'theme') {
        document.body.style.filter = document.body.style.filter ? '' : 'invert(0.9)';
      } else if (a === 'toggle-archive') {
        const key = b.dataset.key;
        S.courses.forEach(c => {
          if (normalizeCourseName(c.name) === key) c.archived = !c.archived;
        });
        renderCourses();
      }
    });
  </script>
</body>
</html>
